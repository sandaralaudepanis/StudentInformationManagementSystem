<!DOCTYPE html> 
<html>
<head>
    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgotPassword.css">

</head>
<body>

<form>
    <h2>Forgot Password?</h2>

    <p>
        Enter your email to verify your account and wait until you receive a password reset email.
    </p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <div class="button-group"></div>
    
        <button type="button" 
            class="btn back-btn"onclick="window.location.href='login.html'">Back</button>
        <button type="submit" class="btn okay-btn">Okay</button>


    </div>
</form>

</body>
</html>
