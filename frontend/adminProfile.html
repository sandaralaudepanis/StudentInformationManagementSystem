<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Profile</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="adminProfile.css">
</head>

<body>

  <div class="sidebar">

    <div class="top-section">

      <div class="logo-area">
        <div class="logo">
          <img src="logo.png" alt="Logo">
        </div>
        <div class="system-title">
          <h2>PNHS</h2>
          <p>Student Information Management System</p>
        </div>
      </div>

      <div class="admin-link">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin</span>
      </div>

      <div class="menu">

        <div class="menu-item" onclick="window.location.href='studentAdmission.html'">
          <i class="fa-solid fa-user-plus"></i>
          <span>Student Admission</span>
        </div>

        <div class="menu-item" onclick="window.location.href='studentInformation.html'">
          <i class="fa-solid fa-users"></i>
          <span>Student Masterlist</span>
        </div>

        <div class="menu-item">
          <i class="fa-solid fa-file-lines"></i>
          <span>Reports</span>
        </div>

      </div>
    </div>

    <div class="logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Logout</span>
    </div>

  </div>

  <div class="main-content">

    <div class="page-title">
      <i class="fa-solid fa-user fa-3x"></i>
      <div>
        <h1>Admin Profile</h1>
        <p>Admin Information</p>
      </div>
    </div>

    <div class="profile-container">

      <!-- Left Side - Profile Picture & Actions -->
      <div class="left-profile">

        <div class="profile-pic">
          <i class=""></i>
        </div>
        <p class="email" id="displayEmail">Admin01@gmail.com</p>

        <div class="button-group">
          <button class="btn delete-btn" onclick="deleteAccount()">Delete</button>
          <button class="btn edit-btn" id="editBtn" onclick="enableEdit()">Edit</button>
        </div>

      </div>

      <!-- Right Side - Forms -->
      <div class="right-profile">

        <!-- Form Wrapper - Two Columns Side by Side -->
        <div class="form-wrapper">

          <!-- Personal Information Section -->
          <div class="form-section">
            <h3><i class="fa-solid fa-user"></i> Personal Information</h3>
            
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="adminName" disabled>
            </div>

            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="adminEmail" disabled>
            </div>

            <div class="form-group">
              <label>Phone Number</label>
              <input type="text" id="adminPhone" disabled>
            </div>
          </div>

          <!-- Change Password Section -->
          <div class="form-section">
            <h3><i class="fa-solid fa-lock"></i> Change Password</h3>

            <div class="form-group">
              <label>Current Password</label>
              <div class="password-wrapper">
                <input type="password" id="currentPassword" disabled>
                <i class="" onclick="togglePassword('currentPassword')"></i>
              </div>
            </div>

            <div class="form-group">
              <label>New Password</label>
              <div class="password-wrapper">
                <input type="password" id="newPassword" disabled>
                <i class="" onclick="togglePassword('newPassword')"></i>
              </div>
            </div>

            <div class="form-group">
              <label>Confirm New Password</label>
              <div class="password-wrapper">
                <input type="password" id="confirmPassword" disabled>
                <i class="" onclick="togglePassword('confirmPassword')"></i>
              </div>
            </div>
          </div>

        </div>

        <!-- Submit Buttons -->
        <div class="submit-area" id="submitArea" style="display: none;">
          <button class="submit-btn" onclick="saveProfile()">Save Changes</button>
          <button class="submit-btn cancel-btn" onclick="cancelEdit()">Cancel</button>
        </div>

      </div>

    </div>

  </div>

  <script>
    // Load Admin Data on Page Load
    document.addEventListener("DOMContentLoaded", loadAdminData);

    function loadAdminData() {
        fetch("/api/admin")
        .then(response => response.json())
        .then(data => {
            document.getElementById("adminName").value = data.name || "";
            document.getElementById("adminEmail").value = data.email || "";
            document.getElementById("adminPhone").value = data.phone_number || "";
            document.getElementById("displayEmail").textContent = data.email || "";
       

            if (data.email) {
            document.getElementById("displayEmail").textContent = data.email;
            console.log("Email loaded: " + data.email); // Check in browser console
        }
          })

        .catch(err => console.error(err));
    }

    // Enable Edit Mode
    function enableEdit() {
        document.getElementById("adminName").disabled = false;
        document.getElementById("adminEmail").disabled = false;
        document.getElementById("adminPhone").disabled = false;
        document.getElementById("currentPassword").disabled = false;
        document.getElementById("newPassword").disabled = false;
        document.getElementById("confirmPassword").disabled = false;
        document.getElementById("submitArea").style.display = "flex";
        document.getElementById("editBtn").style.display = "none";
    }

    // Cancel Edit
    function cancelEdit() {
        document.getElementById("adminName").disabled = true;
        document.getElementById("adminEmail").disabled = true;
        document.getElementById("adminPhone").disabled = true;
        document.getElementById("currentPassword").disabled = true;
        document.getElementById("newPassword").disabled = true;
        document.getElementById("confirmPassword").disabled = true;
        document.getElementById("submitArea").style.display = "none";
        document.getElementById("editBtn").style.display = "block";

        // Reset password fields
        document.getElementById("currentPassword").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";

        // Reset password input types
        document.getElementById("currentPassword").type = "password";
        document.getElementById("newPassword").type = "password";
        document.getElementById("confirmPassword").type = "password";

        loadAdminData();
    }

    // Toggle Password Visibility
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    // Save Profile
    function saveProfile() {
        const name = document.getElementById("adminName").value;
        const email = document.getElementById("adminEmail").value;
        const phone_number = document.getElementById("adminPhone").value;
        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Validate current password
        if (currentPassword === "") {
            alert("Please enter your current password to save changes!");
            return;
        }

        // Check password match
        let password = currentPassword;
        if (newPassword !== "" || confirmPassword !== "") {
            if (newPassword !== confirmPassword) {
                alert("New passwords do not match!");
                return;
            }
            if (newPassword.length < 6) {
                alert("New password must be at least 6 characters!");
                return;
            }
            password = newPassword;
        }

        fetch("/api/admin/update", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name, email, phone_number, password })
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
            cancelEdit();
            loadAdminData();
        })
        .catch(err => console.error(err));
    }

    // Delete Account
    function deleteAccount() {
        const confirmDelete = confirm("Are you sure you want to delete your account?");
        if (confirmDelete) {
            alert("Account deleted! Redirecting to login...");
            logout();
        }
    }

    // Logout
    function logout() {
        fetch("/api/logout", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(response => response.json())
        .then(data => {
            window.location.href = data.redirect;
        })
        .catch(err => console.error(err));
    }
  </script>

</body>
</html>
