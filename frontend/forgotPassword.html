<!DOCTYPE html> 
<html>
<head>
    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgotPassword.css">

</head>
<body>

<form id="forgotForm">
    <h2>Forgot Password?</h2>

    <p>
        Enter your email to verify your account and wait until you receive a password reset email.
    </p>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <div class="button-group">
        <button type="button" class="btn back-btn" onclick="window.location.href='login.html'">Back</button>
        <button type="submit" class="btn okay-btn">Okay</button>
    </div>
</form>

<script>
    document.getElementById("forgotForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const email = document.getElementById("email").value;

        fetch("/api/forgotPassword", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                alert(data.message);
                // In production, you'd redirect to reset password page
                // For demo, we'll show the token
                alert("Reset Token: " + data.token + "\n\nRedirecting to reset page...");
                window.location.href = data.redirect;
            }
        })
        .catch(err => console.error(err));
    });
</script>

</body>
</html>
